<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Process map editor</title>
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/diagram-js.css">
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/bpmn-js.css">
  <link rel="stylesheet" href="/static/vendor/bpmn-js/assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <header>
    <h1 id="title">Loading…</h1>
    <span class="muted" id="version"></span>
    <span class="muted" id="dirty" hidden>· unsaved changes</span>
    <span class="spacer"></span>
    <button id="undo" disabled>Undo</button>
    <button id="save" class="primary" disabled>Save</button>
    <button id="download">Download .bpmn</button>
  </header>
  <main>
    <div id="canvas"></div>
    <aside>
      <div id="panel">
        <div id="diarization" class="banner" hidden>Speakers weren't identified in this recording. Lane assignments may need checking.</div>
        <h2>Selected step</h2>
        <div id="selection" class="muted">Select a step to see where it came from.</div>
        <h2>Open questions <span class="muted" id="q-count"></span></h2>
        <ul id="questions"></ul>
        <h2>Validation <span class="muted" id="e-count"></span></h2>
        <ul id="errors"></ul>
      </div>
      <div id="chat">
        <div id="log"></div>
        <form id="chat-form">
          <textarea id="instruction" placeholder="e.g. “Finance also checks the VAT number before approving”" required></textarea>
          <button class="primary" id="send">Send</button>
        </form>
      </div>
    </aside>
  </main>
  <div id="toast" role="status"></div>
  <script src="/static/vendor/bpmn-js/bpmn-modeler.production.min.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
