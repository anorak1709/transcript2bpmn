<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Process map</title>
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.29.1/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.29.1/dist/assets/bpmn-js.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; color: #222; }
    header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 16px; align-items: baseline; }
    header h1 { font-size: 16px; margin: 0; }
    header a { font-size: 13px; }
    #canvas { position: absolute; top: 45px; bottom: 0; left: 0; right: 0; }
    #error { color: #b00020; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><h1 id="title">Loading…</h1><a id="download" download="process.bpmn">Download .bpmn</a></header>
  <div id="error" hidden></div>
  <div id="canvas"></div>
  <script src="https://unpkg.com/bpmn-js@18.29.1/dist/bpmn-navigated-viewer.production.min.js"></script>
  <script>
    (async () => {
      const mapId = location.pathname.split('/').pop();
      const fail = (msg) => { const e = document.getElementById('error'); e.hidden = false; e.textContent = msg; };
      try {
        const res = await fetch(`/maps/${encodeURIComponent(mapId)}`);
        if (!res.ok) return fail(`Could not load map ${mapId}: HTTP ${res.status}`);
        const map = await res.json();
        document.getElementById('title').textContent = map.model.name;
        document.title = map.model.name;
        document.getElementById('download').href =
          URL.createObjectURL(new Blob([map.bpmn_xml], { type: 'application/xml' }));
        const viewer = new BpmnJS({ container: '#canvas' });
        const { warnings } = await viewer.importXML(map.bpmn_xml);
        if (warnings.length) console.warn('bpmn-js import warnings', warnings);
        viewer.get('canvas').zoom('fit-viewport');
      } catch (err) {
        fail(String(err));
      }
    })();
  </script>
</body>
</html>
