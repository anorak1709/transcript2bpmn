<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>API keys</title>
  <link rel="stylesheet" href="/static/settings.css">
</head>
<body>
  <main>
    <h1>API keys</h1>
    <p class="muted">Keys belong to your organization. A new key is shown once; only its hash is stored.</p>
    <form id="create">
      <label for="name">New key name</label>
      <input id="name" placeholder="e.g. ci, zapier, alice-laptop" required maxlength="255">
      <button class="primary">Create key</button>
    </form>
    <div id="new-key" class="reveal" hidden>
      <strong>Copy this key now. It won't be shown again.</strong>
      <code id="new-key-value"></code>
      <button id="copy" type="button">Copy</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Prefix</th><th>Created</th><th>Status</th><th></th></tr></thead>
      <tbody id="keys"></tbody>
    </table>
    <h2>Usage this month</h2>
    <p id="usage" class="muted">…</p>
    <p id="error" class="error" role="alert"></p>
  </main>
  <script src="/static/settings.js"></script>
</body>
</html>
