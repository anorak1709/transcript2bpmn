services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5433:5432"]  # 5433 on host: avoids clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: cgr.dev/chainguard/minio  # minio/minio left Docker Hub; Chainguard free tier is latest-only
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: .
    # --proxy-headers: trust X-Forwarded-Proto from the TLS proxy (caddy) so HSTS/redirects work.
    # In production don't publish 8000; only the proxy should reach the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: [{path: .env, required: false}]
    environment: &svc_env
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build: .
    command: arq app.workers.settings.WorkerSettings
    ports: ["9100:9100"]  # Prometheus job metrics (METRICS_PORT)
    env_file: [{path: .env, required: false}]
    environment: *svc_env
    depends_on: [redis]

  # HTTPS in front of the API: `DOMAIN=maps.example.com docker compose --profile tls up -d`.
  # A public DOMAIN gets a Let's Encrypt certificate; localhost gets Caddy's local CA.
  caddy:
    image: caddy:2.10.2
    profiles: [tls]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]

volumes:
  caddydata:
  pgdata:
  miniodata:
